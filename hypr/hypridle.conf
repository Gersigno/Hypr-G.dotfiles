general {
    lock_cmd = pidof hyprlock || hyprlock       # Lock command
    before_sleep_cmd = loginctl lock-session    # Lock before sleep
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'  # Turn on display after sleep
}

# Dim backlight (2.5 min)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Lock session (5 min)
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn off display (5.5 min)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}