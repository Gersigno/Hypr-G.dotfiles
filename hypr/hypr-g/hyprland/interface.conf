general {
    gaps_in = 4
    gaps_out = 8
    gaps_workspaces = 50
    border_size = 1
    resize_on_border = false
    allow_tearing = true
    layout = dwindle
    no_focus_fallback = true

    col.active_border = $border_active
    col.inactive_border = $border_inactive

    snap {
    	enabled = true
    }
}

plugin {
    borders-plus-plus {
        add_borders = 1 

        col.border_1 = $border_secondary
        border_size_1 = 1
        natural_rounding = yes
    }
}

misc {
    background_color = $background

    allow_session_lock_restore = true
    middle_click_paste = false
}

decoration {
    rounding = 10
    rounding_power = 4

    active_opacity = 0.85
    inactive_opacity = 0.8
    fullscreen_opacity = 1.0

    dim_inactive = false
    dim_strength = 0.1
    dim_special = 0

    blur {
        enabled = true

        size = 8
        passes = 4

        new_optimizations = true
        xray = true
        ignore_opacity = true

        vibrancy = 0.20
        contrast = 0.9
        brightness = 0.9

        noise = 0.1

        special = false
        popups = true
        input_methods = false
    }

    shadow {
        enabled = true

        range = 16
        render_power = 2
        sharp = false

        color = $shadow_active
        color_inactive = $shadow_inactive
        
        ignore_window = true
    }
}

animations {
    enabled = true

    bezier = default, 0.12, 0.92, 0.08, 1.0
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    bezier = wind, 0.12, 0.92, 0.08, 1.0
    bezier = overshot, 0.18, 0.95, 0.2, 1.08

    # Hyprland default animations
    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    
    animation = windows, 1, 5, wind, popin 60%
    animation = windowsIn, 1, 3, overshot, popin 60%
    animation = windowsOut, 1, 4, overshot, popin 60%
    animation = windowsMove, 1, 4, overshot, gnomed

    animation = fade, 1, 3.03, quick    
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear

    animation = layers, 1, 4, overshot, slide
    animation = layersIn, 1, 4, overshot, slide
    animation = layersOut, 1, 4, overshot, slide #popin 60%

    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear

    animation = workspaces, 1, 4, overshot, slide
    #animation = workspacesIn, 1, 1.21, almostLinear, slide
    #animation = workspacesOut, 1, 1.94, almostLinear, slide

    # Custom animations
    
}

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true

    #new_window_takes_over_fullscreen = 2
    allow_session_lock_restore = true
    focus_on_activate = true
    session_lock_xray = true

    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

ecosystem {
    no_update_news = true # Disable the "What's new" popup on updates
    no_donation_nag = true # Disable donation nag screens
}