# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

windowrulev2 = idleinhibit, fullscreen, fullscreen:1

layerrule = blur,waybar
layerrule = ignorezero ,waybar
layerrule = blur,rofi
layerrule = ignorezero ,rofi
layerrule = blur,fuzzel

# Notification center blur (thanks to zDyant https://github.com/zDyant)
layerrule = blur, swaync-control-center
layerrule = blur, swaync-notification-window
layerrule = ignorezero, swaync-control-center
layerrule = ignorezero, swaync-notification-window
layerrule = ignorealpha 0.5, swaync-control-center
layerrule = ignorealpha 0.5, swaync-notification-window

layerrule = animation slide right, swaync-control-center

# Control Center blur and opacity
layerrule = blur, quickshell:controlCenter
layerrule = ignorealpha 0.79, quickshell:controlCenter
layerrule = animation slide right, quickshell:controlCenter

# Notification popup blur and opacity
layerrule = blur, quickshell:notificationPopup
layerrule = ignorealpha 0.79, quickshell:notificationPopup
layerrule = animation fade, quickshell:notificationPopup