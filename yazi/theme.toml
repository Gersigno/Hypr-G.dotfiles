# : Manager [[[

[manager]
cwd = { fg = "#efdfe1" }

# Tab
tab_active = { fg = "#551d30", bg = "#ffb1c5", bold = true }
tab_inactive = { fg = "#ffd9e1", bg = "#3a071b" }
tab_width = 1

# Find
find_keyword = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied = { fg = "#ffa35a", bg = "#ffa35a" }
marker_cut = { fg = "#ffdcc0", bg = "#ffdcc0" }
marker_marked = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#eebd93", bg = "#eebd93" }

# Count
count_copied = { fg = "#2d1600", bg = "#ffdcc0" }
count_cut = { fg = "#2d1600", bg = "#ffdcc0" }
count_selected = { fg = "#551d30", bg = "#eebd93" }

# Border
border_symbol = "│"
border_style  = { fg = "#ffb1c5" }

# : ]]]


# : Status [[[

[status]
separator_open = "🭁"
separator_close = "🭠"
separator_style = { bg = "#551d30", fg = "#F4A261" }

[mode]
# Mode
normal_main = { bg = "#ffb1c5", fg = "#551d30", bold = true }
normal_alt  = { bg = "#514346", fg = "#d6c2c5" }

# Select mode
select_main = { bg = "#e3bdc5", fg = "#422930", bold = true }
select_alt  = { bg = "#514346", fg = "#d6c2c5" }

# Unset mode
unset_main = { bg = "#eebd93", fg = "#472a0a", bold = true }
unset_alt  = { bg = "#514346", fg = "#d6c2c5" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#ffb1c5", bg = "#413739" }
progress_error = { fg = "#ffb4ab", bg = "#413739" }

# Permissions
permissions_t = { fg = "#b55267" }
permissions_w = { fg = "#c86e20" }
permissions_x = { fg = "#ff2b12" }
permissions_r = { fg = "#ff8727" }
permissions_s = { fg = "#ff4068" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#ffb1c5" }
active = { fg = "#eebd93", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#ffb1c5" }
value = { fg = "#efdfe1" }

# : ]]]


# : Completion [[[

[completion]
border = { fg = "#ffb1c5", bg = "#551d30" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#ffb1c5" }
title = {}
hovered = { fg = "#ffdcc0", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#413739" }
cand = { fg = "#ffb1c5" }
rest = { fg = "#551d30" }
desc = { fg = "#efdfe1" }
separator = " ▶ "
separator_style = { fg = "#efdfe1" }

# : ]]]


# : Help [[[

[help]
on = { fg = "#efdfe1" }
run = { fg = "#efdfe1" }
footer = { fg = "#422930", bg = "#e3bdc5" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#eebd93" }
title_warn = { fg = "#ffb1c5" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { name = "*", fg = "#efdfe1" },
    { name = "*/", fg = "#ffb1c5" },
]

# : ]]]