# : Manager [[[

[manager]
cwd = { fg = "#e0e3e8" }

# Tab
tab_active = { fg = "#00344e", bg = "#95cdf7", bold = true }
tab_inactive = { fg = "#c9e6ff", bg = "#001e2f" }
tab_width = 1

# Find
find_keyword = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied = { fg = "#ab77ff", bg = "#ab77ff" }
marker_cut = { fg = "#eaddff", bg = "#eaddff" }
marker_marked = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#cec0e8", bg = "#cec0e8" }

# Count
count_copied = { fg = "#201635", bg = "#eaddff" }
count_cut = { fg = "#201635", bg = "#eaddff" }
count_selected = { fg = "#00344e", bg = "#cec0e8" }

# Border
border_symbol = "│"
border_style  = { fg = "#95cdf7" }

# : ]]]


# : Status [[[

[status]
separator_open = "🭁"
separator_close = "🭠"
separator_style = { bg = "#00344e", fg = "#F4A261" }

[mode]
# Mode
normal_main = { bg = "#95cdf7", fg = "#00344e", bold = true }
normal_alt  = { bg = "#41474d", fg = "#c1c7ce" }

# Select mode
select_main = { bg = "#b7c9d9", fg = "#22323f", bold = true }
select_alt  = { bg = "#41474d", fg = "#c1c7ce" }

# Unset mode
unset_main = { bg = "#cec0e8", fg = "#352b4b", bold = true }
unset_alt  = { bg = "#41474d", fg = "#c1c7ce" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#95cdf7", bg = "#363a3e" }
progress_error = { fg = "#ffb4ab", bg = "#363a3e" }

# Permissions
permissions_t = { fg = "#557ea2" }
permissions_w = { fg = "#7750bf" }
permissions_x = { fg = "#ff2b12" }
permissions_r = { fg = "#8c44ff" }
permissions_s = { fg = "#309fff" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#95cdf7" }
active = { fg = "#cec0e8", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#95cdf7" }
value = { fg = "#e0e3e8" }

# : ]]]


# : Completion [[[

[completion]
border = { fg = "#95cdf7", bg = "#00344e" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#95cdf7" }
title = {}
hovered = { fg = "#eaddff", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#363a3e" }
cand = { fg = "#95cdf7" }
rest = { fg = "#00344e" }
desc = { fg = "#e0e3e8" }
separator = " ▶ "
separator_style = { fg = "#e0e3e8" }

# : ]]]


# : Help [[[

[help]
on = { fg = "#e0e3e8" }
run = { fg = "#e0e3e8" }
footer = { fg = "#22323f", bg = "#b7c9d9" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#cec0e8" }
title_warn = { fg = "#95cdf7" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { name = "*", fg = "#e0e3e8" },
    { name = "*/", fg = "#95cdf7" },
]

# : ]]]