# : Manager [[[

[manager]
cwd = { fg = "#eae0e7" }

# Tab
tab_active = { fg = "#472150", bg = "#e8b5ef", bold = true }
tab_inactive = { fg = "#fcd7ff", bg = "#2f0a3a" }
tab_width = 1

# Find
find_keyword = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied = { fg = "#ff7e70", bg = "#ff7e70" }
marker_cut = { fg = "#ffdad6", bg = "#ffdad6" }
marker_marked = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#f5b7b1", bg = "#f5b7b1" }

# Count
count_copied = { fg = "#33110e", bg = "#ffdad6" }
count_cut = { fg = "#33110e", bg = "#ffdad6" }
count_selected = { fg = "#472150", bg = "#f5b7b1" }

# Border
border_symbol = "│"
border_style  = { fg = "#e8b5ef" }

# : ]]]


# : Status [[[

[status]
separator_open = "🭁"
separator_close = "🭠"
separator_style = { bg = "#472150", fg = "#F4A261" }

[mode]
# Mode
normal_main = { bg = "#e8b5ef", fg = "#472150", bold = true }
normal_alt  = { bg = "#4c444c", fg = "#cfc3cd" }

# Select mode
select_main = { bg = "#d6c0d6", fg = "#3a2b3c", bold = true }
select_alt  = { bg = "#4c444c", fg = "#cfc3cd" }

# Unset mode
unset_main = { bg = "#f5b7b1", fg = "#4c2521", bold = true }
unset_alt  = { bg = "#4c444c", fg = "#cfc3cd" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#e8b5ef", bg = "#3d373d" }
progress_error = { fg = "#ffb4ab", bg = "#3d373d" }

# Permissions
permissions_t = { fg = "#996499" }
permissions_w = { fg = "#e43a29" }
permissions_x = { fg = "#ff2b12" }
permissions_r = { fg = "#ff503d" }
permissions_s = { fg = "#f13eff" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#e8b5ef" }
active = { fg = "#f5b7b1", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#e8b5ef" }
value = { fg = "#eae0e7" }

# : ]]]


# : Completion [[[

[completion]
border = { fg = "#e8b5ef", bg = "#472150" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#e8b5ef" }
title = {}
hovered = { fg = "#ffdad6", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#3d373d" }
cand = { fg = "#e8b5ef" }
rest = { fg = "#472150" }
desc = { fg = "#eae0e7" }
separator = " ▶ "
separator_style = { fg = "#eae0e7" }

# : ]]]


# : Help [[[

[help]
on = { fg = "#eae0e7" }
run = { fg = "#eae0e7" }
footer = { fg = "#3a2b3c", bg = "#d6c0d6" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#f5b7b1" }
title_warn = { fg = "#e8b5ef" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { name = "*", fg = "#eae0e7" },
    { name = "*/", fg = "#e8b5ef" },
]

# : ]]]