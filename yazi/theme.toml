# : Manager [[[

[manager]
cwd = { fg = "#dfe3e7" }

# Tab
tab_active = { fg = "#00344c", bg = "#92cef5", bold = true }
tab_inactive = { fg = "#c7e7ff", bg = "#001e2e" }
tab_width = 1

# Find
find_keyword = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied = { fg = "#a377ff", bg = "#a377ff" }
marker_cut = { fg = "#e8ddff", bg = "#e8ddff" }
marker_marked = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#ccc0e9", bg = "#ccc0e9" }

# Count
count_copied = { fg = "#1e1635", bg = "#e8ddff" }
count_cut = { fg = "#1e1635", bg = "#e8ddff" }
count_selected = { fg = "#00344c", bg = "#ccc0e9" }

# Border
border_symbol = "│"
border_style  = { fg = "#92cef5" }

# : ]]]


# : Status [[[

[status]
separator_open = "🭁"
separator_close = "🭠"
separator_style = { bg = "#00344c", fg = "#F4A261" }

[mode]
# Mode
normal_main = { bg = "#92cef5", fg = "#00344c", bold = true }
normal_alt  = { bg = "#41484d", fg = "#c1c7ce" }

# Select mode
select_main = { bg = "#b6c9d8", fg = "#21323e", bold = true }
select_alt  = { bg = "#41484d", fg = "#c1c7ce" }

# Unset mode
unset_main = { bg = "#ccc0e9", fg = "#342b4b", bold = true }
unset_alt  = { bg = "#41484d", fg = "#c1c7ce" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#92cef5", bg = "#353a3d" }
progress_error = { fg = "#ffb4ab", bg = "#353a3d" }

# Permissions
permissions_t = { fg = "#557fa0" }
permissions_w = { fg = "#704fc1" }
permissions_x = { fg = "#ff2b12" }
permissions_r = { fg = "#8144ff" }
permissions_s = { fg = "#2ea5ff" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#92cef5" }
active = { fg = "#ccc0e9", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#92cef5" }
value = { fg = "#dfe3e7" }

# : ]]]


# : Completion [[[

[completion]
border = { fg = "#92cef5", bg = "#00344c" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#92cef5" }
title = {}
hovered = { fg = "#e8ddff", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#353a3d" }
cand = { fg = "#92cef5" }
rest = { fg = "#00344c" }
desc = { fg = "#dfe3e7" }
separator = " ▶ "
separator_style = { fg = "#dfe3e7" }

# : ]]]


# : Help [[[

[help]
on = { fg = "#dfe3e7" }
run = { fg = "#dfe3e7" }
footer = { fg = "#21323e", bg = "#b6c9d8" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#ccc0e9" }
title_warn = { fg = "#92cef5" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { name = "*", fg = "#dfe3e7" },
    { name = "*/", fg = "#92cef5" },
]

# : ]]]